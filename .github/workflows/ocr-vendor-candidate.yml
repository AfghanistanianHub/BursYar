name: Prepare OCR first-party vendor candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: node --test tests/ocr-vendor-candidate.test.js
      - name: Fetch exact pinned npm tarballs without executing package scripts
        run: node scripts/prepare-ocr-vendor-candidate.mjs "$RUNNER_TEMP/bursyar-ocr-candidate"
      - name: Show checksums for independent human review
        run: cat "$RUNNER_TEMP/bursyar-ocr-candidate/candidate-manifest.json"
      - name: Upload candidate only - no production publication
        uses: actions/upload-artifact@v4
        with:
          name: ocr-vendor-CANDIDATE-NOT-APPROVED
          path: ${{ runner.temp }}/bursyar-ocr-candidate/
          retention-days: 3
          if-no-files-found: error
