name: BursYar recovery verification
on:
  push:
    branches:
      - work/restore-approved-ai-studio-hero
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and security regression tests
        run: npm test
      - name: Production bundle build
        run: npm run build
