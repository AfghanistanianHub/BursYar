name: BursYar web checks
on:
  pull_request:
  push:
    branches: [main, release-verification]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.9.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:evaluation
      - run: npm run build
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global npm@11.9.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npm run test:emulator
  browser:
    # Pinned: Playwright 1.56.1 has no chromium deps for ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.9.0 --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node verification/typography-probe.mjs
      - run: npm run test:browser
      - run: node verification/dashboard-browser.mjs
      - run: node verification/research-browser.mjs
      - run: node verification/document-review-browser.mjs
      - run: node verification/document-library-browser.mjs
      - run: node verification/local-pdf-browser.mjs
      - run: node verification/document-ocr-integration.mjs
      - run: node verification/document-preview-browser.mjs
      - run: node verification/document-consent-browser.mjs
      - run: node verification/image-preflight-browser.mjs
      - run: node verification/ocr-worker-lifecycle-browser.mjs
      - run: node verification/academic-policy-browser.mjs
      - run: npm run build
      - run: node verification/preview-proxy-browser.mjs
      - run: node verification/document-production-gate-browser.mjs
      - run: node verification/ocr-built-browser.mjs
      - name: Check the opt-in selectable PDF build
        run: |
          VITE_DOCUMENT_TEXT_PDF_PILOT=true npm run build -- --outDir dist-pdf-pilot
          BURSYAR_VERIFY_TEXT_PDF_PILOT=true node verification/document-production-gate-browser.mjs
      - name: Check Firebase popup startup under CSP
        env:
          VITE_FIREBASE_API_KEY: synthetic-key
          VITE_FIREBASE_PROJECT_ID: synthetic-bursyar
          VITE_FIREBASE_AUTH_DOMAIN: synthetic-bursyar.firebaseapp.com
        run: |
          npm run build -- --outDir dist-firebase-csp
          node verification/firebase-csp-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: verification/artifacts/
          retention-days: 7
  macos-helper:
    if: github.ref != 'refs/heads/release-verification'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native masked-entry and Keychain helper
        run: swiftc -module-cache-path "$RUNNER_TEMP/bursyar-swift-cache" verification/macos/BursYarKeychain.swift -o "$RUNNER_TEMP/BursYarKeychain"
      - name: Test targeted attestation updates and redacted record format without Keychain access
        run: '"$RUNNER_TEMP/BursYarKeychain" self-test'
      - name: Check missing-item path without prompting or reading secrets
        run: |
          set +e
          "$RUNNER_TEMP/BursYarKeychain" status
          result=$?
          test "$result" -eq 44
